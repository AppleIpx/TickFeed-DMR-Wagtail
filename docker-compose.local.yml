volumes:
  tickfeeddmr_local_postgres_data: {}
  tickfeeddmr_local_postgres_data_backups: {}
  

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: tickfeeddmr_local_django
    container_name: tickfeeddmr_local_django
    depends_on:
      - postgres
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: tickfeeddmr_production_postgres
    container_name: tickfeeddmr_local_postgres
    volumes:
      - tickfeeddmr_local_postgres_data:/var/lib/postgresql/18/docker
      - tickfeeddmr_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false
