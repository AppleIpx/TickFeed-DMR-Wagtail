<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1140" width="1200" height="1140" role="img" aria-label="Схема: WebSocket Binance передаёт сделку в процесс stream_binance, тот пишет её в Redis Stream через XADD; независимый процесс consume_market_data_stream читает стрим через XREADGROUP, резолвит актив, пишет CryptoPriceSnapshot и подтверждает через XACK. Отмечен исправленный пробел A (ошибка разбора раньше роняла первый процесс, теперь логируется и пропускается) и два открытых: падение между записью и XACK может создать дубликат (B), а XADD без maxlen даёт неограниченный рост стрима в Redis, если консьюмер долго не читает (C).">
  <rect x="0" y="0" width="1200" height="1140" fill="#eef1ee"></rect>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#5c6764"></polygon>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#a8650f"></polygon>
    </marker>
  </defs>

  <!-- Binance node -->
  <rect x="460" y="30" width="280" height="70" rx="14" fill="#ffffff" stroke="#a8650f" stroke-width="1.5"></rect>
  <rect x="486" y="70" width="4" height="18" fill="#a8650f"></rect>
  <rect x="494" y="58" width="4" height="30" fill="#a8650f"></rect>
  <rect x="502" y="66" width="4" height="22" fill="#a8650f"></rect>
  <text x="612" y="60" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="600" fill="#1b2422">Binance</text>
  <text x="600" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#5c6764">пушит сделку по уже открытому WS</text>

  <line x1="600" y1="100" x2="600" y2="148" stroke="#a8650f" stroke-width="3" marker-end="url(#arrow-accent)"></line>

  <!-- Process 1 -->
  <rect x="40" y="150" width="1120" height="270" rx="18" fill="#e6ebe8" stroke="#c7d0cc" stroke-width="1.5" stroke-dasharray="7 6"></rect>
  <text x="64" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" letter-spacing="0.04em" fill="#5c6764">ПРОЦЕСС 1 · КОНТЕЙНЕР binance_stream</text>
  <text x="64" y="200" font-family="system-ui,sans-serif" font-size="12.5" fill="#5c6764">python manage.py stream_binance — Postgres трогает один раз, при старте</text>

  <g>
    <rect x="64" y="216" width="182" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="155" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">Postgres</text>
    <text x="155" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">активные CryptoAsset</text>
    <text x="155" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">(exchange, is_active)</text>
  </g>
  <line x1="246" y1="256" x2="284" y2="256" stroke="#5c6764" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-ink)"></line>

  <g>
    <rect x="286" y="216" width="182" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="377" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">WS connect</text>
    <text x="377" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">1 сокет · все пары</text>
    <text x="377" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">/stream?streams=…</text>
  </g>
  <line x1="468" y1="256" x2="506" y2="256" stroke="#a8650f" stroke-width="2.5" marker-end="url(#arrow-accent)"></line>

  <g>
    <rect x="508" y="216" width="182" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="599" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">ждать</text>
    <text x="599" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">блок, пока Binance</text>
    <text x="599" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">не пришлёт сообщение</text>
  </g>
  <line x1="690" y1="256" x2="728" y2="256" stroke="#a8650f" stroke-width="2.5" marker-end="url(#arrow-accent)"></line>

  <g>
    <rect x="730" y="216" width="182" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="821" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">parse_message</text>
    <text x="821" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">JSON → TradeEvent</text>
  </g>
  <circle cx="905" cy="209" r="13" fill="#dcefe1" stroke="#2f7d4f" stroke-width="2"></circle>
  <text x="905" y="213" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" fill="#2f7d4f">A</text>
  <line x1="912" y1="256" x2="950" y2="256" stroke="#a8650f" stroke-width="2.5" marker-end="url(#arrow-accent)"></line>

  <g>
    <rect x="952" y="216" width="182" height="80" rx="10" fill="#f4dfba" stroke="#a8650f" stroke-width="1.5"></rect>
    <text x="1043" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" fill="#1b2422">XADD</text>
    <text x="1043" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">→ Redis Stream</text>
    <text x="1043" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">dict строк</text>
  </g>

  <path d="M 599,296 C 599,338 377,338 377,296" fill="none" stroke="#5c6764" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-ink)"></path>
  <text x="488" y="354" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5c6764">disconnect → backoff 1s→30s (×2) → reconnect, лог на попытке</text>

  <line x1="155" y1="296" x2="155" y2="320" stroke="#5c6764" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-ink)"></line>
  <text x="155" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">разово, при старте</text>

  <line x1="600" y1="420" x2="600" y2="458" stroke="#a8650f" stroke-width="3" marker-end="url(#arrow-accent)"></line>
  <text x="616" y="433" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#a8650f">XADD</text>
  <circle cx="700" cy="439" r="13" fill="#f6dbd8" stroke="#b3261e" stroke-width="2"></circle>
  <text x="700" y="443" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" fill="#b3261e">C</text>
  <text x="720" y="443" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">без maxlen — растёт неограниченно</text>

  <!-- Redis stream band -->
  <rect x="40" y="460" width="1120" height="180" rx="18" fill="#ece7f6" stroke="#c7d0cc" stroke-width="1.5"></rect>
  <text x="64" y="488" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">Redis Stream · market_data:trades:binance</text>
  <text x="64" y="506" font-family="system-ui,sans-serif" font-size="12" fill="#5c6764">единственная точка контакта процессов — оба знают только про этот стрим</text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">
    <rect x="80" y="522" width="64" height="36" rx="6" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="112" y="544" text-anchor="middle" fill="#5c6764">…-0</text>
    <rect x="158" y="522" width="64" height="36" rx="6" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="190" y="544" text-anchor="middle" fill="#5c6764">…-1</text>
    <rect x="236" y="522" width="64" height="36" rx="6" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="268" y="544" text-anchor="middle" fill="#5c6764">…-2</text>
    <rect x="314" y="522" width="64" height="36" rx="6" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="346" y="544" text-anchor="middle" fill="#5c6764">…-3</text>
    <rect x="392" y="522" width="64" height="36" rx="6" fill="#f4dfba" stroke="#a8650f" stroke-width="1.5"></rect>
    <text x="424" y="544" text-anchor="middle" font-weight="700" fill="#1b2422">…-4</text>
    <text x="470" y="544" font-family="system-ui,sans-serif" font-size="12" fill="#5c6764">← наша сделка, только что дописана</text>
  </g>

  <polygon points="424,566 416,578 432,578" fill="#5c6764"></polygon>
  <text x="424" y="594" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5c6764">курсор группы market_data_ingest — докуда дочитано</text>

  <rect x="980" y="470" width="140" height="50" rx="8" fill="#ffffff" stroke="#c7d0cc" stroke-dasharray="4 3"></rect>
  <text x="1050" y="491" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#1b2422">PEL</text>
  <text x="1050" y="507" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#5c6764">выдано, не подтверждено</text>

  <line x1="600" y1="640" x2="600" y2="678" stroke="#a8650f" stroke-width="3" marker-end="url(#arrow-accent)"></line>
  <text x="616" y="663" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#a8650f">XREADGROUP('&gt;')</text>

  <!-- Process 2 -->
  <rect x="40" y="680" width="1120" height="270" rx="18" fill="#e6ebe8" stroke="#c7d0cc" stroke-width="1.5" stroke-dasharray="7 6"></rect>
  <text x="64" y="710" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" letter-spacing="0.04em" fill="#5c6764">ПРОЦЕСС 2 · КОНТЕЙНЕР market_data_consumer</text>
  <text x="64" y="730" font-family="system-ui,sans-serif" font-size="12.5" fill="#5c6764">python manage.py consume_market_data_stream — не знает про Binance</text>

  <text x="186" y="750" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">при старте: recover_pending — XREADGROUP('0'), пока PEL не опустеет</text>
  <line x1="186" y1="754" x2="186" y2="764" stroke="#5c6764" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-ink)"></line>

  <g>
    <rect x="64" y="766" width="245" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="186" y="798" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">XREADGROUP('&gt;')</text>
    <text x="186" y="816" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">до 100 записей</text>
    <text x="186" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">block 5000мс</text>
  </g>
  <line x1="309" y1="806" x2="337" y2="806" stroke="#a8650f" stroke-width="2.5" marker-end="url(#arrow-accent)"></line>

  <g>
    <rect x="339" y="766" width="245" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="461" y="798" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">deserialize</text>
    <text x="461" y="816" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">битое поле → лог + skip</text>
    <text x="461" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">остальные в пачке не блокирует</text>
  </g>
  <line x1="584" y1="806" x2="612" y2="806" stroke="#a8650f" stroke-width="2.5" marker-end="url(#arrow-accent)"></line>

  <g>
    <rect x="614" y="766" width="245" height="80" rx="10" fill="#f4dfba" stroke="#a8650f" stroke-width="1.5"></rect>
    <text x="736" y="798" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" fill="#1b2422">write_snapshots</text>
    <text x="736" y="816" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">resolve CryptoAsset →</text>
    <text x="736" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">CryptoPriceSnapshot.abulk_create</text>
  </g>
  <circle cx="874" cy="791" r="13" fill="#f6dbd8" stroke="#b3261e" stroke-width="2"></circle>
  <text x="874" y="795" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" fill="#b3261e">B</text>
  <line x1="859" y1="806" x2="887" y2="806" stroke="#a8650f" stroke-width="2.5" marker-end="url(#arrow-accent)"></line>

  <g>
    <rect x="889" y="766" width="245" height="80" rx="10" fill="#ffffff" stroke="#c7d0cc"></rect>
    <text x="1011" y="798" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" fill="#1b2422">XACK</text>
    <text x="1011" y="816" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">снимает сообщение с PEL</text>
    <text x="1011" y="830" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#5c6764">всегда — вне зависимости от шага 3</text>
  </g>

  <line x1="600" y1="950" x2="600" y2="988" stroke="#a8650f" stroke-width="3" marker-end="url(#arrow-accent)"></line>
  <text x="616" y="973" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#a8650f">abulk_create</text>

  <!-- Postgres -->
  <rect x="410" y="990" width="380" height="112" rx="16" fill="#dbe6ef" stroke="#35618c" stroke-width="2"></rect>
  <text x="600" y="1022" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700" fill="#1b2422">Postgres</text>
  <text x="600" y="1044" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#5c6764">CryptoAsset — читает процесс 1, разово при старте</text>
  <text x="600" y="1062" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#5c6764">CryptoPriceSnapshot — пишет процесс 2, каждую пачку</text>
  <text x="600" y="1080" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5c6764">нет колонки trade_id — см. пробел B</text>

  <text x="600" y="1120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5c6764">Амбер — путь одной сделки. Пунктир — разовая/исключительная логика. Красный — открытый пробел, зелёный — уже исправлен (см. stream_binance_flow.md).</text>
</svg>
