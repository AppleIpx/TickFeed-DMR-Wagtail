[project]
name = "tickfeeddmr"
version = "0.1.0"
description = "Behold My Awesome Project!"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Daniel Roy Greenfeld", email = "daniel-roy-greenfeld@example.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "crispy-bootstrap5==2026.3",
  "django==6.0.8",
  "django-allauth[mfa]==65.19.1",
  "django-anymail==15.1",
  "django-celery-beat==2.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-modern-rest>=0.14.0",
  "django-redis==7.0.0",
  "gunicorn==26.1.0",
  "hiredis==3.4.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "psycopg[c]==3.3.4",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "uvicorn[standard]==0.52.3",
  "uvicorn-worker==0.4.0",
  "wagtail==8.0",
  "wagtail-modeladmin>=2.4.0",
  "websockets==17.0.1",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.15.4",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.1.1",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "django-upgrade==1.32.0",
  "djlint==1.44.2",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "prek>=0.4.14",
  "psycopg[c]==3.3.4",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.3",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
ignore = "H006,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "G004",   # Logging statement uses f-string — user's explicit decision (stage 3
  # of the Celery/MOEX/CBR rollout), not an architectural default; see
  # the "Celery" section in CLAUDE.md

  "RUF001", # String contains ambiguous unicode character
  "RUF002", # Docstring contains ambiguous unicode character
  "RUF003", # Comment contains ambiguous unicode character
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = false

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
ini_options.minversion = "9.0"
ini_options.python_files = [
  "test_*.py",
  "tests.py",
]
# ==== pytest ====
# `[tool.pytest]` is not a real pytest config table (pytest only reads
# `[tool.pytest.ini_options]`), so keep everything below this key or it is
# silently ignored — see https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml.
ini_options.addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
ini_options.asyncio_mode = "auto"

[tool.coverage]
# ==== Coverage ====
run.include = [ "tickfeeddmr/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
